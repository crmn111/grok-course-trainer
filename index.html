<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="theme-color" content="#e4eeef">
    <script>
      try {
        var saved = localStorage.getItem("color-scheme");
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (saved === "light" || saved === "dark") scheme.content = saved;
        var dark = scheme.content === "dark" || (scheme.content !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.getElementById("theme-color").content = dark ? "#101618" : "#e4eeef";
      } catch (error) {}
    </script>
    <title>Grok course</title>
    <meta name="description" content="Videos, flashcards, quizzes, and games from the Grok YouTube channel.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Grok course">
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div class="shell">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="#/videos">Grok course</a>
        <ul class="tabs">
          <li><a data-nav="videos" href="#/videos"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M10.2 9.2v5.6l5-2.8z" fill="currentColor" stroke="none"/></svg><span>Videos</span></a></li>
          <li><a data-nav="cards" href="#/cards"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="12" height="14" rx="2"/><path d="M5 16.5V5.8A1.8 1.8 0 0 1 6.8 4H16"/></svg><span>Cards</span></a></li>
          <li><a data-nav="quiz" href="#/quiz"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M8.6 12.2 11 14.6 15.6 9.6"/></svg><span>Quiz</span></a></li>
          <li><a data-nav="play" href="#/play"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M10.2 9.2v5.6l5-2.8z" fill="currentColor" stroke="none"/></svg><span>Games</span></a></li>
          <li><a data-nav="progress" href="#/progress"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15.2 11.2 11l2.6 2.4L18 8"/></svg><span>Progress</span></a></li>
        </ul>
        <div class="tools">
          <a class="streak" id="streak" href="#/progress">Start today</a>
          <button type="button" class="icon-btn" id="theme-toggle">
            <span class="when-light">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.6v1.8M12 18.6v1.8M3.6 12h1.8M18.6 12h1.8M6.1 6.1l1.3 1.3M16.6 16.6l1.3 1.3M17.9 6.1l-1.3 1.3M7.4 16.6l-1.3 1.3"/></svg>
              <span class="vh">Switch to dark theme</span>
            </span>
            <span class="when-dark">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3.6a7.2 7.2 0 1 0 4.6 11.6A6 6 0 0 1 15.2 3.6z"/></svg>
              <span class="vh">Switch to light theme</span>
            </span>
          </button>
        </div>
      </nav>
      <main id="view" tabindex="-1"></main>
    </div>
    <div id="live" class="vh" aria-live="polite"></div>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <h1 id="confirm-title"></h1>
      <p id="confirm-body"></p>
      <form method="dialog">
        <button type="submit" value="cancel" id="confirm-cancel" autofocus>Cancel</button>
        <button type="submit" value="confirm" id="confirm-ok">Confirm</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
